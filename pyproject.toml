[project]
name = "sentryblur"
version = "0.1.0"
description = "Blur faces and license plates in dashcam footage"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy",
    "opencv-python",
    "tqdm",
    "imageio-ffmpeg>=0.5",
    "insightface",
    "onnxruntime",
]

[project.optional-dependencies]
plates = [
    "ultralytics",
]
prompt = [
    "torch",
    "torchvision",
    "transformers>=4.45,<4.53",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "hydra-core",
    "iopath",
]

[project.scripts]
sentryblur = "sentryblur.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentryblur"]

[dependency-groups]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
